name: abe-program
services:
  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: abe-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"   # REST + Dashboard，仅本机
      - "127.0.0.1:6334:6334"   # gRPC，仅本机
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
volumes:
  qdrant_storage:
